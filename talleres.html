<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, escala inicial=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fontstastic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2? family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-main: #3b125e;
      --púrpura-oscura: #270b40;
      --red-accent: #d32f2f;
      --red-hover: #b71c1c;
      --bg-light: #f8fafc;
      --superficie: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --fronteriza: #e2e8f0;
      --shadow-md: 0 10px 25px -5px rgba(59, 18, 94, 0.08);
    }

    * { tamaño de caja: border-box; margen: 0; relleno: 0; }
    
    Cuerpo { 
      font-family: 'Plus Yakarta Sans', system-ui, sans-serif; 
      color de fondo: var(--bg-light); 
      Color: var(--text-main); 
      Altura de línea: 1.6;
    }

    Cabecera { 
      Fondo: var(--púrpura-oscura); 
      Color: #ffffff; 
      Acolchado: 1rem 2rem; 
      Posición: pegajoso; 
      Top: 0; 
      z-índice: 1000;
      Sombra de caja: 0 4px 12px rgba(0,0,0,0.15);
    }

    .nav-contenedor { 
      Ancho máximo: 1200px; 
      Margen: 0 auto; 
      Pantalla: flex; 
      justificar contenido: espacio entre ellos; 
      Elementos alineados: centro; 
    }

    .logo-texto { 
      font-family: 'Playfair Display', serif;
      tamaño de fuente: 1.4rem; 
      peso fuente: 700; 
      Color: #ffffff;
      texto-decoración: ninguno;
    }

    .logo-text span { color: var(--red-accent); font-style: italic; }

    .btn-back {
      Fondo: rgba(255, 255, 255, 0.15);
      Color: #ffffff;
      texto-decoración: ninguno;
      Acolchado: 0.4rem 1rem;
      Radio de frontera: 6px;
      peso de fuente: 600;
      tamaño de fuente: 0.9rem;
      Transición: fondo 0.2s;
    }

    .btn-back:hover { fondo: var(--red-accent); }

    .hero-página { 
      Fondo: gradiente lineal (135 deg, var (- púrpura-principal) 0%, var(--púrpura-oscura) 100%); 
      Color: #ffffff; 
      Text-align: centro; 
      Acolchado: 3rem 1.5rem 4rem 1.5rem; 
    }

    .hero-page h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    .hero-page p { color: #cbd5e1; tamaño de fuente: 1.1rem; }

    .main-envoltorio {
      Ancho máximo: 1200px;
      Margen: -2rem auto 4rem auto;
      Acolchado: 0 1.5rem;
      Posición: relativa;
      z-índice: 10;
    }

    .year-header {
      Margen: 2.5rem 0 1.2rem 0;
      Pantalla: flex;
      Elementos alineados: centro;
      brecha: 0.8rem;
    }

    .year-header h2 { font-size: 1.6rem; color: var(--purple-main); font-weight: 800; }

    .year-header::antes {
      Contenido: "";
      Pantalla: bloque en línea;
      Ancho: 4px;
      Altura: 24px;
      Fondo: var(--red-accent);
      Radio de frontera: 2px;
    }

    .workshop-red {
      Pantalla: cuadrícula;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      brecha: 1.5rem;
      Margen-fondo: 3rem;
    }

    .workshop-tarjeta {
      Fondo: var(--superficie);
      Frontera: 1px var sólido (-frontera);
      Radio de frontera: 12px;
      Acolchado: 1.8rem 1.5rem;
      Box-shadow: var(--shadow-md);
      Transición: transforma 0.3s facilidad, borde-color 0.3s facilidad;
      Pantalla: flex;
      dirección de la flexión: columna;
      justificar contenido: espacio entre ellos;
    }

    .workshop-card:hover {
      Transformación: translateY(-5px);
      borde-color: var(--purple-main);
    }

    .card-num {
      Tamaño de fuente: 0.75rem;
      peso fuente: 800;
      color: var(--red-accent);
      text-transform: mayúscula;
      margen-fondo: 0.4rem;
    }

    .workshop-tarjeta h3 {
      tamaño de fuente: 1.2rem;
      Color: var(--púrpura-principal);
      peso fuente: 700;
      margen-fondo: 0.6rem;
      Altura de línea: 1.3;
    }

    .workshop-tarjeta p {
      tamaño de fuente: 0.9rem;
      color: var(--text-muted);
      Margen-fondo: 1.5rem;
    }

    .action-grupo {
      Pantalla: flex;
      dirección de la flexión: columna;
      hueco: 0.5rem;
    }

    .btn-descarga {
      Pantalla: bloque;
      Text-align: centro;
      Fondo: var(--red-accent);
      Color: #ffffff;
      peso fuente: 700;
      Tamaño de fuente: 0.85rem;
      Acolchado: 0.6rem 1rem;
      Radio de frontera: 6px;
      texto-decoración: ninguno;
      Transición: fondo 0.2s facilidad;
    }

    .btn-download:hover { fondo: var(--red-hover); }

    .btn-sub {
      Pantalla: bloque;
      Text-align: centro;
      Fondo: var(--bg-light);
      Color: var(--púrpura-principal);
      Frontera: 1px var sólido (-frontera);
      peso de fuente: 600;
      Tamaño de fuente: 0.8rem;
      Acolchado: 0.4rem 0.8rem;
      Radio de frontera: 6px;
      texto-decoración: ninguno;
      Transición: toda la facilidad de 0.2s;
    }

    .btn-sub:hover {
      Fondo: #ffffff;
      borde-color: var(--purple-main);
    }

    Pie de página { 
      Fondo: var(--púrpura-oscura);
      Color: #94a3b8;
      Text-align: centro; 
      Acolchado: 2.5rem 1.5rem; 
      tamaño de fuente: 0.9rem; 
      borde-top: 3px sólido var(--red-accent);
    }
  </ Estilo>
</cabeza>
